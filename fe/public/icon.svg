<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="ozik-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="ozik-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="45%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="ozik-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Architectural Ticket Silhouette with Dual Side Notches -->
  <path d="M 14,4 C 8.5,4 5,7.5 5,13 L 5,24 C 9.5,24 13,27.5 13,32 C 13,36.5 9.5,40 5,40 L 5,51 C 5,56.5 8.5,60 14,60 L 50,60 C 55.5,60 59,56.5 59,51 L 59,40 C 54.5,40 51,36.5 51,32 C 51,27.5 54.5,24 59,24 L 59,13 C 59,7.5 55.5,4 50,4 Z" 
        fill="url(#ozik-bg)" 
        stroke="url(#ozik-emerald)" 
        stroke-width="3" 
        stroke-linejoin="round" />

  <!-- Perforation Guide Notch Center-Line -->
  <line x1="13" y1="32" x2="19" y2="32" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-opacity="0.6" stroke-dasharray="2 3"/>
  <line x1="45" y1="32" x2="51" y2="32" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-opacity="0.6" stroke-dasharray="2 3"/>

  <!-- Outer Cryptographic Ring 'O' Frame -->
  <rect x="18" y="14" width="28" height="36" rx="8" 
        fill="none" 
        stroke="#10b981" 
        stroke-width="2.5" 
        stroke-opacity="0.3" />

  <!-- Dynamic Laser 'Z' Monogram -->
  <path d="M 22,21 H 42 L 22,43 H 42" 
        fill="none" 
        stroke="url(#ozik-emerald)" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#ozik-glow)" />

  <!-- Inner Cryptographic TOTP Core Aperture -->
  <circle cx="32" cy="32" r="3.5" fill="#ffffff" />
  <circle cx="32" cy="32" r="1.5" fill="#030712" />
</svg>