name: Keep-Alive Supabase & Render

on:
  schedule:
    # Run every 6 hours (Supabase pauses after 7 days of inactivity; this keeps it awake forever)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend & Supabase
        run: |
          echo "Pinging OzikTix Services to keep Supabase PostgreSQL and Render warm..."
          # If user sets RENDER_BACKEND_URL in GitHub repository secrets, ping it:
          if [ -n "${{ secrets.RENDER_BACKEND_URL }}" ]; then
            echo "Pinging ${{ secrets.RENDER_BACKEND_URL }}/api/v1/ping..."
            curl -s -f "${{ secrets.RENDER_BACKEND_URL }}/api/v1/ping" || echo "Ping Render returned non-200"
          else
            echo "RENDER_BACKEND_URL secret not set yet. You can add it in Repo Settings -> Secrets."
          fi
          echo "Keep-alive ping step finished."
