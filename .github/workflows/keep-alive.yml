name: Keep-Alive Supabase & Render

on:
  schedule:
    # Run every 6 hours (Supabase pauses after 7 days of inactivity; this keeps it awake forever)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend & Supabase
        run: |
          echo "Pinging OzikTix Services to keep Supabase PostgreSQL and Render warm..."
          TARGET_URL="${{ secrets.RENDER_BACKEND_URL }}"
          if [ -z "$TARGET_URL" ]; then
            TARGET_URL="https://oziktix.onrender.com"
          fi
          echo "Pinging ${TARGET_URL}/api/v1/ping..."
          curl -s -f "${TARGET_URL}/api/v1/ping" || echo "Ping Render returned non-200"
          echo "Keep-alive ping step finished."

